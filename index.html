<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            href="resources/favicon.ico"
            type="image/x-icon"
            sizes="96x96"
        />
        <link rel="stylesheet" href="styles.css" />
        <title>devChallenges.io | Minimal Blog Card</title>
    </head>
    <body>
        <main>
            <div class="card">
                <img
                    class="cactus-mobile-img"
                    src="./resources/Cactus.jpg"
                    alt="a picture of cactus in a brown pot"
                />
                <div class="design-pill">
                    <p>Design</p>
                </div>
                <div class="card-text">
                    <h1 class="card-title">Embracing Minimalism</h1>
                    <p class="card-text">
                        From minimalist sculptures to minimalist paintings, this
                        blog will inspire you to appreciate the beauty that lies
                        in simplicity.
                    </p>
                </div>
                <hr />
                <p class="card-author">Annie Spratt</p>
            </div>
        </main>
        <div class="author-info">
            Coded by <a href="#">Jon McKenzie</a> | Challenge by
            <a
                rel="noopener"
                href="https://www.devchallenges.io?ref=challenge"
                target="_blank"
                >devChallenges.io</a
            >.
        </div>
    </body>
</html>
